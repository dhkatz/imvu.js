name: 'Release'

# Changesets release flow:
# - Pending changesets on master → open/update a "Version Packages" PR (versions + changelogs).
# - Merging that PR (no changesets left) → publish the new versions to npm, tag them,
#   and create GitHub releases.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two releases at once; let a running one finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: 'Version or publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version branch, tags and GitHub releases
      pull-requests: write # open the "Version Packages" PR
      id-token: write # npm provenance and trusted publishing (OIDC)
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: 'Node'
        uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11, which supports trusted publishing.
          node-version: 24
          cache: 'npm'

      # Trusted publishing needs npm 11.5.1+; don't rely on the version bundled with Node.
      - name: 'Update npm'
        run: npm install -g npm@^11.5.1

      - name: 'Install'
        run: npm ci

      - name: 'Build'
        run: npm run build

      # Never publish something that doesn't pass the same checks as CI.
      - name: 'Check'
        run: |
          npm run test:typecheck
          npm run lint
          npm run test

      # v2 understands Changesets v3 output; v1 published but missed it, so it pushed no
      # tags and created no GitHub releases. npm authenticates with trusted publishing
      # (OIDC, `id-token: write` above): no npm token is stored anywhere.
      - name: 'Version PR or publish'
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
